services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./embeddings:/app/embeddings"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["./embeddings:/app/embeddings"]
