[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs GEMINI_API_KEY and a built index (deselect with -m 'not integration')"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905", "E741"]
