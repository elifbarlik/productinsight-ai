name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # No API key in CI: unit tests use fakes, integration tests are skipped automatically.
      - run: pytest -q
      - name: Offline retrieval evaluation (BM25 + filters)
        run: python -m eval.run_eval --configs bm25,bm25+filter --out ci
